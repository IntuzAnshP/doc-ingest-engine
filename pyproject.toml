[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-ingest-engine"
version = "0.1.0"
description = "Enterprise document parsing, normalizer, and structure-aware chunking engine for RAG systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Enterprise AI Team" }
]
keywords = [
    "rag", "document-parsing", "chunking", "pdf", "docx", "xlsx", "notion", "llm"
]
dependencies = [
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["doc_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

